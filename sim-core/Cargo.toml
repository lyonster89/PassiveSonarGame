[package]
name = "sim-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ocean ray tracing and bearings-only tracking for a browser sonar simulator. Public sources only; see SOURCES.md."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
